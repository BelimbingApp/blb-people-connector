name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Run independently of repository changes so a moving platform main cannot
  # turn this connector red silently between pull requests. GitHub cron is UTC.
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

jobs:
  ci:
    uses: BelimbingApp/belimbing/.github/workflows/domain-ci.yml@d8f4bd6df2f44c91c1c8a88a43ed4f2549fa4953
    with:
      domain-path: app/Domains/PeopleConnector
      platform-ref: d8f4bd6df2f44c91c1c8a88a43ed4f2549fa4953
      sonar-project-key: BelimbingApp_blb-people-connector
      sonar-organization: belimbingapp
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
