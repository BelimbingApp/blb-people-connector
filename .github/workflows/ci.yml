name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Run independently of repository changes so a moving platform main cannot
  # turn this connector red silently between pull requests. GitHub cron is UTC.
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

jobs:
  ci:
    uses: BelimbingApp/belimbing/.github/workflows/domain-ci.yml@a965c522e4065a35790fb9fe2d192d9d2e8e205a
    with:
      domain-path: app/Domains/PeopleConnector
      platform-ref: a965c522e4065a35790fb9fe2d192d9d2e8e205a
      sonar-project-key: BelimbingApp_blb-people-connector
      sonar-organization: belimbingapp
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
