name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Run independently of repository changes so a moving platform main cannot
  # turn this connector red silently between pull requests. GitHub cron is UTC.
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

jobs:
  ci:
    uses: BelimbingApp/belimbing/.github/workflows/domain-ci.yml@c76b7104ae32d1bb07e392ad13eb8209574f980b
    with:
      domain-path: app/Domains/PeopleConnector
      platform-ref: c76b7104ae32d1bb07e392ad13eb8209574f980b
      sonar-project-key: BelimbingApp_blb-people-connector
      sonar-organization: belimbingapp
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
